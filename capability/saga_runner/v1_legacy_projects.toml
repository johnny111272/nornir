# Projects checked under V1 rules — the legacy whitelist.
#
# V2 zone-architecture checks are the DEFAULT for all Python project code.
# A [[projects]] entry here routes a project to V1 checks instead: legacy
# structured projects awaiting migration, and evolving work where zone
# enforcement would be premature. This list trends toward EMPTY — projects
# leave it by migrating (via the scaffolder) or by their scripts gaining
# PEP 723 declarations. Nothing is ever added without a decision.
#
# Paths are RELATIVE TO THE AI ROOT, not absolute. is_v1_legacy strips the
# root from the file path before matching, and recognises both `~/ai/` and
# `~/.ai/` — so entries stay correct across a root rename and while the
# tree is split with some sections migrated and others not.
#
# Embedded at compile time (include_str!) — after editing:
#     nornir_deploy --build tools
#
# Scripts (PEP 723 shebang) and test files always take V1 rules regardless
# of this list; see run_checks_v2 in gleipnir_core.

# ── Active, must not block ──────────────────────────────────────────

[[projects]]
path = "annie/"                 # evolving new project — decided 2026-08-03

[[projects]]
path = "smidja/bifrost/"        # live proxy infrastructure, V1 layout

# ── Phoenix (successor generation, dormant awaiting this infrastructure) ──

[[projects]]
