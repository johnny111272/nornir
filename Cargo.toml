[workspace]
members = [
    "core/error_core",
    "core/format_core",
    "core/schema_core",
    "core/path_core",
    "core/syn_core",
    "core/default_apply_core",
    "capability/schemas_embedded",
    "capability/path_verify_io",
    "capability/io_check",
    "capability/gate_io",
    "capability/intercept_io",
    "capability/default_apply_io",
    "gates/gate_raw_definition_input",
    "gates/gate_raw_definition_defaults",
    "gates/gate_paths_resolved_output",
    "gates/gate_paths_verified",
    "gates/gate_paths_verified_input",
    "gates/gate_guardrails_reduced_input",
    "gates/gate_guardrails_reduced_output",
    "gates/gate_success_reduced_input",
    "gates/gate_success_reduced_output",
    "gates/gate_criteria_merged_input",
    "gates/gate_criteria_merged_output",
    "gates/gate_instructions_reduced_input",
    "gates/gate_instructions_reduced_output",
    "gates/gate_examples_reduced_input",
    "gates/gate_examples_reduced_output",
    "gates/gate_execution_merged_input",
    "gates/gate_execution_merged_output",
    "gates/gate_includes_merged_output",
    "gates/gate_includes_merged_input",
    "gates/gate_permissions_resolved_output",
    "gates/gate_permissions_resolved_input",
    "gates/gate_universal_format_input",
    "gates/gate_universal_format_output",
    "gates/gate_universal_render_output",
    "gates/gate_universal_render_input",
    "gates/gate_anthropic_render_output",
    "gates/gate_anthropic_render_input",
    "gates/gate_include_success_criteria_input",
    "gates/gate_include_failure_criteria_input",
    "gates/gate_include_execution_instructions_input",
    "gates/gate_include_example_entries_input",
    "gates/gate_include_example_group_input",
    "gates/gate_include_guardrails_constraints_input",
    "gates/gate_include_guardrails_anti_patterns_input",
    "gates/gate_galdr_style_input",
    "cli/check_raw_definition",
    "cli/check_paths_resolved",
    "cli/check_paths_verified",
    "cli/check_includes_merged",
    "cli/check_permissions_resolved",
    "cli/check_universal_format",
    "cli/check_universal_render",
    "cli/check_anthropic_render",
    "capability/write_engine",
    "writers/append_truth_qc_report_record",
    "writers/write_truth_glossary_record",
    "writers/append_embedding_normalize_batch_20",
    "writers/append_interview_summaries_record",
    "writers/append_raw_jsonl",
    "dispatchers/split_jsonl_batches",
    "capability/hook_io",
    "capability/datagram_io",
    "hooks/hook_pre_subagent_tool",
    "hooks/hook_pre_subagent_bash",
    "hooks/hook_pre_llm_tool",
    "hooks/hook_pre_llm_bash",
    "hooks/hook_post_llm_tool",
    "hooks/hook_stop_llm_tts",
    "core/gleipnir_core",
    "core/announce_core",
    "core/time_core",
    "core/text_core",
    "core/saga_core",
    "core/report_render_core",
    "cli/saga_cli",
    "cli/syn_cli",
    "cli/hush",
    "senders/send_heartbeat",
    "senders/send_notification",
    "senders/send_warning",
    "senders/send_alert",
    "senders/send_datagram",
    "watchers/watch_and_diff_exchange_intercepts",
    "converters/convert_json_to_toml",
    "rewriters/rewrite_compaction_summary",
    "core/datagram_core",
    "core/diff_core",
    "core/compaction_inject_core",
    "core/intercept_core",
    "capability/session_io",
    "interceptors/traffic_interceptor_rewriter",
    "interceptors/intercept_replay",
    "daemons/record_datagrams",
    "capability/saga_runner",
    "cli/announce",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
toon-format = "0.4"
jsonschema = "0.29"
thiserror = "2.0"
pyo3 = { version = "0.22", features = ["extension-module"] }
regex = "1.11"
jaq-interpret = { version = "1.5", features = ["serde_json"] }
jaq-parse = "1.0"
tree-sitter = "0.25"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", features = ["blocking"] }
dotenvy = "0.15"
rodio = "0.19"
